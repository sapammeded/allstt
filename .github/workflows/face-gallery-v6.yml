name: Apply STT face gallery V7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip face-gallery]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch STT face photo behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('stt.html')
          s = p.read_text(encoding='utf-8')

          # Remove every previous face-gallery/runtime patch so only this
          # implementation controls the FOTO WAJAH button.
          for sid in (
              'ALLSTT-STT-RUNTIME-FIX-V5',
              'ALLSTT-STT-RUNTIME-FIX-V4',
              'ALLSTT-STT-FACE-GALLERY-V6',
              'ALLSTT-STT-FACE-GALLERY-V7',
              'hidden-face-gallery-v2',
              'ALLSTT-startup-camera-fix'
          ):
              s = re.sub(r'<script[^>]*id=["\']'+re.escape(sid)+r'["\'][^>]*>.*?</script>', '', s, flags=re.I|re.S)

          # Remove the visible gallery/password card from the UI. The gallery
          # input itself remains hidden and is opened only after the password.
          for ident in ('officerGalleryAccess','officerGalleryPassword','unlockOfficerGalleryBtn'):
              s = re.sub(r'<[^>]+id=["\']'+re.escape(ident)+r'["\'][^>]*>.*?</[^>]+>', '', s, flags=re.I|re.S)
          s = re.sub(r'<div[^>]*>\s*(?:<[^>]*>)*\s*(?:UPLOAD\s+DARI\s+GALERI|Upload\s+dari\s+galeri).*?</div>\s*</div>', '', s, flags=re.I|re.S)

          # Requested password is canonical; preserve a user-defined password,
          # but migrate the previous built-in password once.
          s = s.replace('const DEFAULT_GALLERY_PASSWORD = "supangat505";', 'const DEFAULT_GALLERY_PASSWORD = "mbahpritampan";')
          s = s.replace('const DEFAULT_GALLERY_PASSWORD = "supangat505"; // Password awal galeri', 'const DEFAULT_GALLERY_PASSWORD = "mbahpritampan"; // Password awal galeri')

          patch = r'''<script id="ALLSTT-STT-FACE-GALLERY-V7">
          (function(){
            'use strict';
            const PASSWORD='mbahpritampan';
            const WAIT=360;

            function install(){
              const btn=document.getElementById('takeOfficerPhotoBtn');
              const cam=document.getElementById('officerPhotoInput');
              const gal=document.getElementById('officerGalleryInput');
              if(!btn||!cam||!gal||btn.dataset.faceV7==='1')return;
              btn.dataset.faceV7='1';

              // Never show the protected gallery controls in the normal UI.
              ['officerGalleryAccess','officerGalleryPassword','unlockOfficerGalleryBtn'].forEach(function(id){
                const e=document.getElementById(id);
                if(e){
                  const card=e.closest('.card')||e.closest('[style*="border-top"]')||e.parentElement;
                  if(card) card.style.display='none'; else e.style.display='none';
                }
              });
              gal.style.display='none';
              gal.removeAttribute('capture');
              gal.setAttribute('accept','image/*');

              let pending=false;
              let timer=null;

              function reset(){
                pending=false;
                if(timer){clearTimeout(timer);timer=null;}
              }

              function openCamera(){
                reset();
                cam.removeAttribute('multiple');
                cam.setAttribute('capture','user');
                cam.value='';
                cam.click();
              }

              function openProtectedGallery(){
                reset();
                const pw=window.prompt('Masukkan password untuk upload foto wajah dari galeri:');
                if(pw===null)return;
                if(pw!==PASSWORD){
                  window.alert('❌ Password salah. Akses galeri ditolak.');
                  return;
                }
                gal.value='';
                gal.removeAttribute('capture');
                gal.setAttribute('accept','image/*');
                gal.click();
              }

              // Single tap: wait briefly, then open camera.
              // Second fast tap during that window: cancel camera and ask password.
              btn.addEventListener('click',function(e){
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                if(pending){
                  openProtectedGallery();
                  return;
                }
                pending=true;
                timer=setTimeout(openCamera,WAIT);
              },true);

              // Also suppress any legacy double-click handler.
              btn.addEventListener('dblclick',function(e){
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                openProtectedGallery();
              },true);

              gal.addEventListener('change',async function(){
                const file=gal.files&&gal.files[0];
                if(!file)return;
                try{
                  if(typeof saveOfficerPhoto==='function') await saveOfficerPhoto(file);
                  else if(typeof window.saveOfficerPhoto==='function') await window.saveOfficerPhoto(file);
                  else throw new Error('Fungsi penyimpanan foto wajah tidak tersedia.');
                  window.alert('✅ Foto wajah dari galeri berhasil dipasang.');
                }catch(err){
                  window.alert('❌ Foto galeri gagal diproses: '+(err&&err.message||err));
                }finally{gal.value='';}
              },true);
            }

            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});
            else install();
            window.addEventListener('load',install);
            [300,800,1500,2500].forEach(function(ms){setTimeout(install,ms);});
          })();
          </script>'''

          s = s.replace('</body>', patch + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('STT face gallery V7 applied')

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stt.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: STT face single tap camera and protected double tap gallery [skip face-gallery] [skip stt-runtime] [skip hidden-gallery]"
          git push
