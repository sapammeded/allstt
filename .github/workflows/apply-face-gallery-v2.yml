name: Apply STT protected face gallery v2
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip face-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_face_gallery_v2.py
      - name: Commit STT patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stt.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: protected face gallery v2 [skip face-fix]"
          git push