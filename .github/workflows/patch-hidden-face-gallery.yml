name: Apply STT runtime fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip hidden-gallery]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch STT
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('stt.html')
          s=p.read_text(encoding='utf-8')

          # Remove the two older gesture patches that can compete with the new handler.
          for sid in ('hidden-face-gallery-v2','ALLSTT-startup-camera-fix'):
              s=re.sub(r'<script[^>]*id=["\']'+re.escape(sid)+r'["\'][^>]*>.*?</script>', '', s, flags=re.I|re.S)

          marker='ALLSTT_STT_RUNTIME_FIX_V4'
          if marker in s:
              print('V4 already installed')
              raise SystemExit(0)

          patch=r'''
<script id="ALLSTT-STT-RUNTIME-FIX-V4">
/* ALLSTT_STT_RUNTIME_FIX_V4 */
(function(){
  'use strict';
  function el(id){return document.getElementById(id)}
  function put(k,v){try{localStorage.setItem(k,v)}catch(_){} }

  // CONTINUE: works even if the main application initializer hit an exception.
  function continueFix(){
    const btn=el('aamiinBtn'), modal=el('notificationModal');
    if(!btn || btn.dataset.v4Continue) return;
    btn.dataset.v4Continue='1';
    btn.addEventListener('click',function(e){
      e.preventDefault(); e.stopImmediatePropagation();
      if(modal) modal.style.display='none';
      put('bangPriNotif','dilihat');
    },true);
  }

  // HAMBURGER: independent from the large STT IIFE, so it remains usable if
  // another feature throws an exception during startup.
  function hamburgerFix(){
    const btn=el('hamburgerBtn'), nav=el('sideNav'), ov=el('navOverlay');
    if(!btn || !nav || !ov || btn.dataset.v4Hamburger) return;
    btn.dataset.v4Hamburger='1';
    function close(){
      nav.classList.remove('open'); ov.classList.remove('open');
      btn.setAttribute('aria-expanded','false');
      const i=btn.querySelector('i'); if(i)i.className='fas fa-bars';
    }
    function open(){
      nav.classList.add('open'); ov.classList.add('open');
      btn.setAttribute('aria-expanded','true');
      const i=btn.querySelector('i'); if(i)i.className='fas fa-xmark';
    }
    btn.addEventListener('click',function(e){
      e.preventDefault(); e.stopImmediatePropagation();
      nav.classList.contains('open')?close():open();
    },true);
    ov.addEventListener('click',close,true);
    nav.querySelectorAll('.nav-item').forEach(function(item){
      item.addEventListener('click',function(e){
        e.stopImmediatePropagation();
        const tab=item.dataset.tab, target=item.dataset.target;
        close();
        if(tab && typeof window.switchToTab==='function'){window.switchToTab(tab);return;}
        if(target){
          const node=el(target);
          if(node){
            document.querySelectorAll('.menu-only-section').forEach(x=>x.classList.remove('menu-section-open'));
            if(target!=='top')node.classList.add('menu-section-open');
            if(target==='top')window.scrollTo({top:0,behavior:'smooth'});
            else setTimeout(function(){node.scrollIntoView({behavior:'smooth',block:'start'})},50);
          }
        }
      },true);
    });
  }

  // OFFICER FACE:
  // single tap -> camera only; fast double tap -> password -> Android image
  // chooser (installed camera apps + gallery). Gallery is never available
  // without the password.
  function officerFaceFix(){
    const btn=el('takeOfficerPhotoBtn'), cam=el('officerPhotoInput'), gal=el('officerGalleryInput');
    if(!btn||!cam||!gal||btn.dataset.v4Face) return;
    btn.dataset.v4Face='1';
    let waiting=false,timer=null; const WAIT=330;
    function cameraOnly(){cam.setAttribute('capture','user');cam.value='';cam.click()}
    function protectedChooser(){
      const pw=window.prompt('Masukkan password untuk kamera + galeri foto wajah:');
      if(pw===null)return;
      let expected=''; try{expected=typeof getGalleryPassword==='function'?getGalleryPassword():''}catch(_){}
      if(!expected||pw!==expected){alert('❌ Password salah. Akses ditolak.');return}
      gal.removeAttribute('capture'); gal.setAttribute('accept','image/*'); gal.value=''; gal.click();
    }
    btn.addEventListener('click',function(e){
      e.preventDefault(); e.stopImmediatePropagation();
      if(waiting){waiting=false;if(timer)clearTimeout(timer);timer=null;protectedChooser();return}
      waiting=true;
      timer=setTimeout(function(){if(!waiting)return;waiting=false;timer=null;cameraOnly()},WAIT);
    },true);

    // Direct gallery input handler for the protected officer-photo gallery path.
    gal.addEventListener('change',async function(e){
      const file=e.target.files&&e.target.files[0]; if(!file)return;
      try{
        if(typeof saveOfficerPhoto==='function') await saveOfficerPhoto(file);
        else if(typeof window.saveOfficerPhoto==='function') await window.saveOfficerPhoto(file);
        else {
          const reader=new FileReader();
          reader.onload=function(){
            const img=el('officerPhotoPreview'),wrap=el('officerPhotoPreviewWrap'),status=el('officerPhotoStatus'),rm=el('removeOfficerPhotoBtn');
            if(img)img.src=reader.result;if(wrap)wrap.style.display='block';if(status)status.textContent='✅ Foto wajah siap dimasukkan ke PDF.';if(rm)rm.style.display='inline-flex';
          }; reader.readAsDataURL(file);
        }
      }catch(err){alert('❌ Foto galeri gagal diproses: '+(err&&err.message||err))}
      finally{gal.value=''}
    },true);
  }

  // PATROL AREA CAMERA uses the same single/double tap rule.
  function patrolCameraFix(){
    const btn=el('openCameraMenu'),cam=el('nativeCameraInput'),gal=el('galleryCameraInput');
    if(!btn||!cam||!gal||btn.dataset.v4Patrol) return;
    btn.dataset.v4Patrol='1';
    let waiting=false,timer=null;const WAIT=330;
    function ready(){
      try{
        const data=typeof patrolData!=='undefined'?patrolData:{};
        if(!Object.keys(data||{}).length){alert('⚠️ Buat area dulu sebelum mengambil foto!');return false}
        if(typeof currentTargetArea!=='undefined'&&!currentTargetArea){alert('⚠️ Pilih area terlebih dahulu!');return false}
      }catch(_){}
      return true;
    }
    function cameraOnly(){if(!ready())return;cam.setAttribute('capture','environment');cam.value='';cam.click()}
    function protectedChooser(){
      if(!ready())return;
      const pw=window.prompt('Masukkan password untuk kamera + galeri:');if(pw===null)return;
      let expected='';try{expected=typeof getGalleryPassword==='function'?getGalleryPassword():''}catch(_){}
      if(!expected||pw!==expected){alert('❌ Password salah!');return}
      gal.removeAttribute('capture');gal.setAttribute('accept','image/*');gal.value='';gal.click();
    }
    btn.addEventListener('click',function(e){
      e.preventDefault();e.stopImmediatePropagation();
      if(waiting){waiting=false;if(timer)clearTimeout(timer);timer=null;protectedChooser();return}
      waiting=true;timer=setTimeout(function(){if(!waiting)return;waiting=false;timer=null;cameraOnly()},WAIT);
    },true);
  }

  function install(){continueFix();hamburgerFix();officerFaceFix();patrolCameraFix()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
  window.addEventListener('load',install);setTimeout(install,300);setTimeout(install,1000);
})();
</script>
'''
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('STT V4 runtime patch applied')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stt.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: STT runtime V4 [skip hidden-gallery]"
          git push
