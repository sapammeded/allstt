name: Build FINAL ALLSTT APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply final admin gallery runtime patch
        run: python3 final_runtime_patch.py
      - name: Prepare HTML assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app/src/main/assets')
          a.mkdir(parents=True, exist_ok=True)
          for n in ('stt.html','hvss2.html','vacs.html','launcher.html'):
              src=Path(n)
              if not src.is_file():
                  raise SystemExit(f'Missing root asset: {n}')
              (a/n).write_text(src.read_text(encoding='utf-8'), encoding='utf-8')
          PY
      - name: Verify launcher icon
        run: test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
