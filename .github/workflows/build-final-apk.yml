name: Build FINAL ALLSTT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply HVSS native CENTRAL transport patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_hvss_native.py

      - name: Prepare HTML assets from current repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          for n in stt.html hvss2.html vacs.html launcher.html; do
            test -s "$n"
            cp -f "$n" "app/src/main/assets/$n"
          done

      - name: Build APK from current repository
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
