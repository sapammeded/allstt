name: Build FINAL ALLSTT APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply STT identity and letterhead patch
        shell: python
        run: python apply_identity_default.py
      - name: Finalize persistent identity storage
        shell: python
        run: python finalize_identity_persistence.py
      - name: Finalize STT PDF letterhead integration
        shell: python
        run: python finalize_letterhead_pdf.py
      - name: Prepare HTML assets
        shell: python
        run: |
          from pathlib import Path
          assets=Path('app/src/main/assets')
          assets.mkdir(parents=True,exist_ok=True)
          for name in ('stt.html','hvss2.html','vacs.html','launcher.html'):
              (assets/name).write_text(Path(name).read_text(encoding='utf-8'),encoding='utf-8')
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error