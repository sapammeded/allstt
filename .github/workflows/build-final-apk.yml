name: Build FINAL ALLSTT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare FINAL HTML assets unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          for n in stt.html hvss2.html vacs.html launcher.html; do
            test -s "$n"
            cp -f "$n" "app/src/main/assets/$n"
          done

      - name: Verify FINAL HTML assets
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/stt.html
          test -s app/src/main/assets/hvss2.html
          test -s app/src/main/assets/vacs.html
          test -s app/src/main/assets/launcher.html

      - name: Validate STT JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('stt.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/stt-inline.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          print(f'STT inline scripts: {len(scripts)}')
          PY
          node --check /tmp/stt-inline.js

      - name: Validate HVSS2 JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('hvss2.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/hvss2-inline.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          print(f'HVSS2 inline scripts: {len(scripts)}')
          PY
          node --check /tmp/hvss2-inline.js

      - name: Validate VACS JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('vacs.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/vacs-inline.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          print(f'VACS inline scripts: {len(scripts)}')
          PY
          node --check /tmp/vacs-inline.js

      - name: Verify launcher icon
        run: test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
