name: Build FINAL ALLSTT APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CURRENT repository baseline
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply ONLY unified ADMIN authorization
        run: python3 apply_admin_patch.py

      - name: Remove legacy gallery redispatch and harden Android upload
        run: python3 final_runtime_fix_v7.py

      - name: Apply protected gallery/company feature policy
        run: python3 protect_features.py

      - name: Apply ONLY officer gallery photo PDF persistence fix
        run: python3 apply_officer_photo_pdf_fix.py

      - name: Apply ONLY announcement Continue button Android WebView fix
        run: python3 apply_announcement_button_fix.py

      - name: Prepare CURRENT HTML assets unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('app/src/main/assets')
          a.mkdir(parents=True, exist_ok=True)
          for n in ('stt.html', 'hvss2.html', 'vacs.html', 'launcher.html'):
              src = Path(n)
              if not src.is_file():
                  raise SystemExit(f'Missing root asset: {n}')
              (a / n).write_text(src.read_text(encoding='utf-8'), encoding='utf-8')
          PY

      - name: Verify baseline Kamera & Area Patroli exists
        run: |
          grep -q 'id="cameraTab"' stt.html
          grep -q 'id="openCameraMenu"' stt.html
          grep -q 'id="galleryCameraInput"' stt.html
          grep -q 'id="targetAreaSelect"' stt.html

      - name: Verify baseline company identity, kop surat & signature exists
        run: |
          grep -q 'id="companySection"' stt.html
          grep -q 'IDENTITAS PERUSAHAAN' stt.html
          grep -q 'KOP SURAT' stt.html
          grep -q 'TANDA TANGAN' stt.html

      - name: Verify protected feature policy
        run: |
          grep -q 'ALLSTT-FINAL-ADMIN-GATE-V1' stt.html
          grep -q 'ONE ADMIN SESSION protects every gallery/company administration action' stt.html
          ! grep -q "alert('✅ Foto berhasil ditambahkan ke" stt.html

      - name: Verify final Android runtime hardening
        run: |
          grep -q 'ALLSTT FINAL UPLOAD BRIDGE V7' stt.html
          grep -q 'IndexedDB unavailable' stt.html
          grep -q 'EXTRA_ALLOW_MULTIPLE' app/src/main/java/com/sapammeded/allstt/MainActivity.java

      - name: Verify officer gallery photo PDF fix
        run: |
          grep -q 'OFFICER_PHOTO_PDF_FIX_V1' stt.html
          grep -q 'const pdfOfficerPhotoData = officerPhotoDataUrl || await loadOfficerPhoto();' stt.html

      - name: Verify announcement Continue button fix
        run: |
          grep -q 'ALLSTT ANNOUNCEMENT BUTTON FIX V3' stt.html
          grep -q 'onclick="try{var m=document.getElementById('\''notificationModal'\'')' stt.html
          grep -q 'ALLSTT-ANNOUNCEMENT-BUTTON-FIX-V3-CSS' stt.html

      - name: Validate patched STT JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('stt.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          inline = '\n\n'.join(scripts)
          Path('/tmp/allstt-inline.js').write_text(inline, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script blocks')
          PY
          node --check /tmp/allstt-inline.js

      - name: Verify launcher icon
        run: test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
