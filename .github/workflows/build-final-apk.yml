name: Build FINAL ALLSTT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Update HVSS2 CENTRAL Web App URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hvss2.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://script.google.com/macros/s/AKfycbwNvGUEqrVBqHa3vkKh20UWEuTAfhgsM4cXznk6sxeUxQARTs5xcoJwzuDwmI61rzwrVg/exec'
          new = 'https://script.google.com/macros/s/AKfycbxsXmQDGTgd1bJwZHyR7QRpuAbDv6-GoRGpm9ypHqp0S2StWhz4QntHqI89oMAcrL0dIg/exec'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 old HVSS2 GAS URL, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('HVSS2 GAS URL updated to new deployment')
          PY
          grep -F 'AKfycbxsXmQDGTgd1bJwZHyR7QRpuAbDv6-GoRGpm9ypHqp0S2StWhz4QntHqI89oMAcrL0dIg/exec' hvss2.html
          if grep -Fq 'AKfycbwNvGUEqrVBqHa3vkKh20UWEuTAfhgsM4cXznk6sxeUxQARTs5xcoJwzuDwmI61rzwrVg/exec' hvss2.html; then
            echo 'ERROR: old HVSS2 GAS URL still present'
            exit 1
          fi

      - name: Prepare FINAL HTML assets unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          for n in stt.html hvss2.html vacs.html launcher.html; do
            test -s "$n"
            cp -f "$n" "app/src/main/assets/$n"
          done

      - name: Verify FINAL HTML assets
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/stt.html
          test -s app/src/main/assets/hvss2.html
          test -s app/src/main/assets/vacs.html
          test -s app/src/main/assets/launcher.html
          grep -F 'AKfycbxsXmQDGTgd1bJwZHyR7QRpuAbDv6-GoRGpm9ypHqp0S2StWhz4QntHqI89oMAcrL0dIg/exec' app/src/main/assets/hvss2.html

      - name: Validate STT JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('stt.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/stt-inline.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          print(f'STT inline scripts: {len(scripts)}')
          PY
          node --check /tmp/stt-inline.js

      - name: Validate HVSS2 JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('hvss2.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/hvss2-inline.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          print(f'HVSS2 inline scripts: {len(scripts)}')
          PY
          node --check /tmp/hvss2-inline.js

      - name: Validate VACS JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('vacs.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/vacs-inline.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          print(f'VACS inline scripts: {len(scripts)}')
          PY
          node --check /tmp/vacs-inline.js

      - name: Verify launcher icon
        run: test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
