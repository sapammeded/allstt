name: Build FINAL ALLSTT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply HVSS native CENTRAL transport patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_hvss_native.py

      - name: Apply Android WebView JavaScript dialog patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_android_js_dialogs.py

      - name: Build assets from every root HTML module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets
          python3 tools/build_allstt_assets.py
          test -s app/src/main/assets/launcher.html
          count=$(find app/src/main/assets -maxdepth 1 -type f -name '*.html' | wc -l)
          echo "HTML assets built: $count"
          test "$count" -ge 2
          find app/src/main/assets -maxdepth 1 -type f -name '*.html' -printf '%f\n' | sort

      - name: Build APK from current repository
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
