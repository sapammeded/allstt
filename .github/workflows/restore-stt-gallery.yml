name: Restore STT gallery protection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[skip gallery-restore]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore exact known-good STT HTML
        run: |
          set -e
          git fetch origin main --tags
          git checkout 77e38ac91d2f942f5fe12fc49d58fb1eb8b80a8f -- stt.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- stt.html; then
            echo 'STT already matches the known-good version.'
            exit 0
          fi
          git add stt.html
          git commit -m 'fix: restore STT gallery protection [skip face-fix] [skip gallery-restore]'
          git push origin HEAD:main
