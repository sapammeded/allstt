name: Restore STT gallery protection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.id == 'ff6b80581af945c7bcf73c325e08424e00998da3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert regression commit
        run: |
          set -e
          if git merge-base --is-ancestor ff6b80581af945c7bcf73c325e08424e00998da3 HEAD; then
            if git log --format=%H -n 1 --grep='Restore STT gallery protection'; then
              echo 'Restore commit already exists.'
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git revert --no-edit ff6b80581af945c7bcf73c325e08424e00998da3
            git push origin HEAD:main
          else
            echo 'Regression commit is not in history; nothing to restore.'
          fi
