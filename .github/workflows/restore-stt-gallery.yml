name: Restore STT gallery protection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[skip gallery-restore]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore last known good STT gallery behavior
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          changed=0
          for sha in bbbdf4c6f477c5861177981393bb92135c07e396 1b194f2683e3f9d592bea61b1391e1663d6cf9ed; do
            if git merge-base --is-ancestor "$sha" HEAD; then
              git revert --no-edit "$sha"
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git commit --amend -m 'fix: restore STT gallery protection [skip face-fix] [skip gallery-restore]'
            git push origin HEAD:main
          else
            echo 'No gallery regression commits found.'
          fi
