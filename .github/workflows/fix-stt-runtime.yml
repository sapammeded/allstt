name: Fix STT runtime and protected face gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip stt-runtime]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch STT runtime
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('stt.html')
          s=p.read_text(encoding='utf-8')
          for script_id in ('hidden-face-gallery-v2','ALLSTT-startup-camera-fix'):
              s=re.sub(r'<script[^>]*id=["\']'+re.escape(script_id)+r'["\'][^>]*>.*?</script>', '', s, flags=re.I|re.S)
          marker='ALLSTT_STT_RUNTIME_FIX_V3'
          if marker in s:
              print('Runtime patch already present')
              raise SystemExit(0)
          patch=r'''
<script id="ALLSTT-STT-RUNTIME-FIX-V3">
/* ALLSTT_STT_RUNTIME_FIX_V3 */
(function(){
'use strict';
function byId(id){return document.getElementById(id)}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(_){}
}
function fixContinue(){
 const modal=byId('notificationModal'),btn=byId('aamiinBtn');
 if(!btn||btn.dataset.runtimeFixV3)return;
 btn.dataset.runtimeFixV3='1';
 btn.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();if(modal)modal.style.display='none';safeSet('bangPriNotif','dilihat')},true)
}
function fixHamburger(){
 const btn=byId('hamburgerBtn'),nav=byId('sideNav'),overlay=byId('navOverlay');
 if(!btn||!nav||!overlay||btn.dataset.runtimeFixV3)return;
 btn.dataset.runtimeFixV3='1';
 function close(){nav.classList.remove('open');overlay.classList.remove('open');btn.setAttribute('aria-expanded','false');const i=btn.querySelector('i');if(i)i.className='fas fa-bars'}
 function open(){nav.classList.add('open');overlay.classList.add('open');btn.setAttribute('aria-expanded','true');const i=btn.querySelector('i');if(i)i.className='fas fa-xmark'}
 btn.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();nav.classList.contains('open')?close():open()},true);
 overlay.addEventListener('click',close,true);
 nav.querySelectorAll('.nav-item').forEach(function(item){item.addEventListener('click',function(){const target=item.dataset.target,tab=item.dataset.tab;close();if(tab&&typeof window.switchToTab==='function'){window.switchToTab(tab);return}if(target){const el=byId(target);if(el){document.querySelectorAll('.menu-only-section').forEach(x=>x.classList.remove('menu-section-open'));if(target!=='top')el.classList.add('menu-section-open');if(target==='top')window.scrollTo({top:0,behavior:'smooth'});else setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'start'})},60)}}},true)})
}
function fixOfficerFace(){
 const btn=byId('takeOfficerPhotoBtn'),camera=byId('officerPhotoInput'),gallery=byId('officerGalleryInput');
 if(!btn||!camera||!gallery||btn.dataset.runtimeFaceV3)return;
 btn.dataset.runtimeFaceV3='1';
 let waiting=false,timer=null;const DOUBLE_TAP_MS=330;
 function openCamera(){camera.removeAttribute('multiple');camera.setAttribute('capture','user');camera.value='';camera.click()}
 function openProtectedChooser(){
  const pw=window.prompt('Masukkan password untuk akses kamera + galeri foto wajah:');if(pw===null)return;
  let expected='';try{expected=typeof getGalleryPassword==='function'?getGalleryPassword():''}catch(_){}
  if(!expected||pw!==expected){window.alert('❌ Password salah. Akses kamera + galeri ditolak.');return}
  gallery.removeAttribute('capture');gallery.setAttribute('accept','image/*');gallery.value='';gallery.click()
 }
 btn.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();if(waiting){waiting=false;if(timer)clearTimeout(timer);timer=null;openProtectedChooser();return}waiting=true;timer=setTimeout(function(){if(!waiting)return;waiting=false;timer=null;openCamera()},DOUBLE_TAP_MS)},true)
}
function fixPatrolCamera(){
 const btn=byId('openCameraMenu'),camera=byId('nativeCameraInput'),gallery=byId('galleryCameraInput');
 if(!btn||!camera||!gallery||btn.dataset.runtimePatrolV3)return;
 btn.dataset.runtimePatrolV3='1';let waiting=false,timer=null;const DOUBLE_TAP_MS=330;
 function ready(){try{const data=typeof patrolData!=='undefined'?patrolData:{};if(!Object.keys(data||{}).length){alert('⚠️ Buat area dulu sebelum mengambil foto!');return false}if(typeof currentTargetArea!=='undefined'&&!currentTargetArea){alert('⚠️ Pilih area terlebih dahulu!');return false}}catch(_){}return true}
 function openCamera(){camera.setAttribute('capture','environment');camera.value='';camera.click()}
 function openProtectedChooser(){if(!ready())return;const pw=window.prompt('Masukkan password untuk akses kamera + galeri:');if(pw===null)return;let expected='';try{expected=typeof getGalleryPassword==='function'?getGalleryPassword():''}catch(_){}if(!expected||pw!==expected){alert('❌ Password salah!');return}gallery.removeAttribute('capture');gallery.setAttribute('accept','image/*');gallery.value='';gallery.click()}
 btn.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();if(waiting){waiting=false;if(timer)clearTimeout(timer);timer=null;openProtectedChooser();return}waiting=true;timer=setTimeout(function(){if(!waiting)return;waiting=false;timer=null;if(ready())openCamera()},DOUBLE_TAP_MS)},true)
}
function install(){fixContinue();fixHamburger();fixOfficerFace();fixPatrolCamera()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
window.addEventListener('load',install);setTimeout(install,300);setTimeout(install,1000)
})();
</script>
'''
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('STT runtime V3 patch applied')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stt.html
          if git diff --cached --quiet; then echo "No STT changes"; exit 0; fi
          git commit -m "fix: STT runtime V3 [skip stt-runtime]"
          git push
