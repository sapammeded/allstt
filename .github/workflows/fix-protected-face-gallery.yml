name: Fix STT protected face gallery

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip face-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install one stable protected gallery controller
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('stt.html')
          s = p.read_text(encoding='utf-8')

          # Remove every previous face-gallery patch block so only one controller remains.
          ids = [
              'ALLSTT-STT-FACE-GALLERY-V7',
              'ALLSTT-STT-RUNTIME-FIX-V5',
              'ALLSTT-STT-FACE-GALLERY-V6',
              'ALLSTT-STT-FACE-GALLERY-V5',
              'ALLSTT-STT-FACE-GALLERY-FINAL',
          ]
          for sid in ids:
              s = re.sub(r'<script[^>]*id=["\\\']' + re.escape(sid) + r'["\\\'][^>]*>.*?</script>', '', s, flags=re.I|re.S)

          # Remove obsolete standalone face-gallery controls if an older version left them behind.
          for eid in ['officerGalleryPassword','unlockOfficerGalleryBtn','officerGalleryAccess','uploadOfficerGalleryBtn']:
              s = re.sub(r'<[^>]*id=["\\\']' + eid + r'["\\\'][^>]*>.*?</[^>]+>', '', s, flags=re.I|re.S)

          patch = r'''
<script id="ALLSTT-STT-FACE-GALLERY-FINAL">
(function(){
  'use strict';
  const PASSWORD = 'mbahpritampan';
  const DOUBLE_TAP_MS = 380;

  function getPassword(){
    try {
      return typeof getGalleryPassword === 'function' ? getGalleryPassword() : PASSWORD;
    } catch(_) { return PASSWORD; }
  }

  function setGallerySessionUnlocked(){
    try { window.galleryAccessGranted = true; } catch(_) {}
    // galleryAccessGranted is a lexical variable in the original STT code.
    // Calling renderAreas rebuilds every patrol area and exposes its multi-photo
    // gallery controls when that session flag is true.
    try { if (typeof renderAreas === 'function') renderAreas(); } catch(_) {}
  }

  function install(){
    const face = document.getElementById('takeOfficerPhotoBtn');
    const cam = document.getElementById('officerPhotoInput');
    const gal = document.getElementById('officerGalleryInput');
    if(!face || !cam || !gal || face.dataset.faceFinal === '1') return;
    face.dataset.faceFinal = '1';

    // No gallery/password UI is shown on the normal page.
    ['officerGalleryAccess','officerGalleryPassword','unlockOfficerGalleryBtn','uploadOfficerGalleryBtn'].forEach(function(id){
      const el = document.getElementById(id);
      if(el){
        const card = el.closest('.card');
        if(card && card !== face.closest('.card')) card.remove();
        else el.remove();
      }
    });

    // Remove legacy click listeners from the face button.
    const btn = face.cloneNode(true);
    btn.dataset.faceFinal = '1';
    face.replaceWith(btn);

    cam.removeAttribute('multiple');
    cam.setAttribute('accept','image/*');
    gal.removeAttribute('capture');
    gal.setAttribute('accept','image/*');
    gal.removeAttribute('multiple');
    gal.style.display='none';

    let timer = null;
    let pending = false;

    function reset(){
      pending = false;
      if(timer){ clearTimeout(timer); timer=null; }
    }

    function openCamera(){
      reset();
      cam.setAttribute('capture','user');
      cam.value='';
      cam.click();
    }

    async function openProtectedGallery(){
      reset();
      const pw = window.prompt('Masukkan password untuk upload foto wajah dari galeri:');
      if(pw === null) return;
      if(pw !== getPassword()){
        window.alert('❌ Password salah. Akses galeri ditolak.');
        return;
      }

      // One successful password entry unlocks the protected gallery features
      // for this session, including multi-photo gallery controls in every area.
      setGallerySessionUnlocked();

      gal.value='';
      gal.removeAttribute('capture');
      gal.setAttribute('accept','image/*');
      gal.click();
    }

    function secondTap(){
      if(!pending) return false;
      openProtectedGallery();
      return true;
    }

    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      if(secondTap()) return;
      pending=true;
      timer=setTimeout(function(){
        if(pending) openCamera();
      }, DOUBLE_TAP_MS);
    }, true);

    btn.addEventListener('dblclick', function(e){
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      openProtectedGallery();
    }, true);

    gal.addEventListener('change', async function(){
      const file = gal.files && gal.files[0];
      if(!file) return;
      try{
        if(typeof saveOfficerPhoto === 'function'){
          await saveOfficerPhoto(file);
        } else if(typeof window.saveOfficerPhoto === 'function'){
          await window.saveOfficerPhoto(file);
        } else {
          throw new Error('Fungsi penyimpanan foto wajah tidak tersedia.');
        }
        const status = document.getElementById('officerPhotoStatus');
        if(status) status.textContent='✅ Foto wajah dari galeri siap dimasukkan ke PDF.';
      }catch(err){
        window.alert('❌ Foto galeri gagal diproses: ' + (err && err.message ? err.message : err));
      }finally{
        gal.value='';
      }
    }, true);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true});
  else install();
  window.addEventListener('load',install);
  [300,800,1500,2500].forEach(function(ms){ setTimeout(install,ms); });
})();
</script>
'''

          s = s.replace('</body>', patch + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stt.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: protected STT face gallery and patrol multi-gallery [skip face-fix]"
          git push
