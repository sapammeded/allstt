name: Fix STT protected face gallery

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip face-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace conflicting face handlers with one stable handler
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('stt.html')
          s=p.read_text(encoding='utf-8')
          ids = [
            'ALLSTT-STT-FACE-GALLERY-V7',
            'ALLSTT-STT-RUNTIME-FIX-V5',
            'ALLSTT-STT-FACE-GALLERY-V6',
            'ALLSTT-STT-FACE-GALLERY-V5',
          ]
          for sid in ids:
            s=re.sub(r'<script[^>]*id=["\\\']'+re.escape(sid)+r'["\\\'][^>]*>.*?</script>', '', s, flags=re.I|re.S)
          patch=r'''
<script id="ALLSTT-STT-FACE-GALLERY-FINAL">
(function(){
  'use strict';
  const PASSWORD='mbahpritampan';
  const DOUBLE_TAP_MS=350;
  function install(){
    const btn=document.getElementById('takeOfficerPhotoBtn');
    const cam=document.getElementById('officerPhotoInput');
    const gal=document.getElementById('officerGalleryInput');
    if(!btn||!cam||!gal||btn.dataset.faceFinal==='1') return;
    btn.dataset.faceFinal='1';
    gal.removeAttribute('capture');
    gal.setAttribute('accept','image/*');
    gal.style.position='fixed';
    gal.style.left='-10000px';
    gal.style.top='0';
    gal.style.width='1px';
    gal.style.height='1px';
    gal.style.opacity='0';
    gal.style.pointerEvents='none';
    gal.style.display='block';
    let timer=null, pending=false;
    function reset(){ pending=false; if(timer){clearTimeout(timer);timer=null;} }
    function openCamera(){
      reset();
      cam.removeAttribute('multiple');
      cam.setAttribute('accept','image/*');
      cam.setAttribute('capture','user');
      cam.value='';
      cam.click();
    }
    function openProtectedGallery(){
      reset();
      const pw=window.prompt('Masukkan password untuk upload foto wajah dari galeri:');
      if(pw===null) return;
      if(pw!==PASSWORD){ window.alert('❌ Password salah. Akses galeri ditolak.'); return; }
      gal.value='';
      gal.removeAttribute('capture');
      gal.setAttribute('accept','image/*');
      gal.click();
    }
    btn.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      if(pending){ openProtectedGallery(); return; }
      pending=true;
      timer=setTimeout(openCamera,DOUBLE_TAP_MS);
    },true);
    btn.addEventListener('dblclick',function(e){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      openProtectedGallery();
    },true);
    gal.addEventListener('change',async function(){
      const file=gal.files&&gal.files[0];
      if(!file) return;
      try{
        if(typeof window.saveOfficerPhoto==='function') await window.saveOfficerPhoto(file);
        else if(typeof saveOfficerPhoto==='function') await saveOfficerPhoto(file);
        else throw new Error('Fungsi penyimpanan foto wajah tidak tersedia.');
      }catch(err){
        window.alert('❌ Foto galeri gagal diproses: '+(err&&err.message||err));
      }finally{ gal.value=''; }
    },true);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true});
  else install();
  window.addEventListener('load',install);
  [300,800,1500].forEach(function(ms){setTimeout(install,ms);});
})();
</script>
'''
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stt.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: protected STT face gallery gesture [skip face-fix]"
          git push
