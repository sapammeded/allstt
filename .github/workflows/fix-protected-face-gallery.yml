name: Fix STT protected face gallery
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply gallery fix
        run: python3 apply_gallery_fix.py
      - name: Commit STT patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stt.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "manual: protected STT face gallery"
          git push
