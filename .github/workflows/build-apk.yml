name: Build ALLSTT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare HTML assets
        shell: python
        run: |
          from pathlib import Path

          assets = Path('app/src/main/assets')
          assets.mkdir(parents=True, exist_ok=True)
          for name in ('stt.html','hvss2.html','vacs.html','launcher.html'):
              (assets/name).write_text(Path(name).read_text(encoding='utf-8'), encoding='utf-8')

          stt = assets/'stt.html'
          html = stt.read_text(encoding='utf-8')
          patch = Path('officer-gallery-patch.js').read_text(encoding='utf-8')
          marker = 'ALLSTT: protected officer face photo source switch.'
          if marker not in html:
              injection = '<script>\n' + patch + '\n</script>\n'
              if '</body>' in html:
                  html = html.replace('</body>', injection + '</body>', 1)
              else:
                  html += '\n' + injection
          stt.write_text(html, encoding='utf-8')

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
