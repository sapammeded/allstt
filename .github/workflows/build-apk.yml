name: Build ALLSTT APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore exact known-good STT baseline
        run: curl -fsSL https://raw.githubusercontent.com/sapammeded/allstt/77e38ac91d2f942f5fe12fc49d58fb1eb8b80a8f/stt.html -o stt.html
      - name: Apply unified ADMIN access layer
        run: python3 apply_admin_patch.py
      - name: Fix Android face gallery import
        run: python3 fix_face_gallery.py
      - name: Harden HTML navigation
        run: python3 patch_navigation.py
      - name: Apply final admin gallery runtime patch
        run: python3 final_runtime_patch.py
      - name: Apply unified patrol camera/gallery admin bridge
        run: python3 admin_camera_gallery_v5.py
      - name: Prepare assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app/src/main/assets'); a.mkdir(parents=True,exist_ok=True)
          for n in ('stt.html','hvss2.html','vacs.html','launcher.html'):
              src=Path(n)
              if not src.is_file(): raise SystemExit(f'Missing root asset: {n}')
              (a/n).write_text(src.read_text(encoding='utf-8'),encoding='utf-8')
          PY
      - name: Verify launcher icon
        run: test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error