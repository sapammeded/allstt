name: Build ALLSTT APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CURRENT repository baseline
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # IMPORTANT: never replace stt.html with an old commit and never stack
      # runtime/UI patches that can remove or duplicate baseline features.
      # The repository's CURRENT stt.html is the single source of truth.
      - name: Apply ONLY unified ADMIN authorization
        run: python3 apply_admin_patch.py

      # Final build-time policy: keep every baseline feature/UI intact while
      # making ONE successful ADMIN session the authorization for all gallery
      # uploads and company identity/logo editing.
      - name: Enforce single ADMIN gate without replacing baseline UI
        run: python3 enforce_admin_gate.py

      - name: Prepare CURRENT HTML assets unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('app/src/main/assets')
          a.mkdir(parents=True, exist_ok=True)
          for n in ('stt.html', 'hvss2.html', 'vacs.html', 'launcher.html'):
              src = Path(n)
              if not src.is_file():
                  raise SystemExit(f'Missing root asset: {n}')
              (a / n).write_text(src.read_text(encoding='utf-8'), encoding='utf-8')
          PY

      - name: Verify baseline Kamera & Area Patroli exists
        run: |
          grep -q 'id="cameraTab"' stt.html
          grep -q 'id="openCameraMenu"' stt.html
          grep -q 'id="galleryCameraInput"' stt.html
          grep -q 'id="targetAreaSelect"' stt.html

      - name: Verify company identity & signature baseline exists
        run: |
          grep -q 'id="companySection"' stt.html
          grep -q 'IDENTITAS PERUSAHAAN' stt.html
          grep -q 'TANDA TANGAN' stt.html

      - name: Verify final ADMIN gate exists
        run: grep -q 'ALLSTT-FINAL-ADMIN-GATE-V1' stt.html

      - name: Verify launcher icon
        run: test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
