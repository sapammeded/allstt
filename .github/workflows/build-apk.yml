name: Build ALLSTT APK

on:
  push:
    branches: [main, android-wrapper]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare original HTML assets
        run: |
          mkdir -p app/src/main/assets
          cp stt.html app/src/main/assets/stt.html
          cp hvss2.html app/src/main/assets/hvss2.html
          cp vacs.html app/src/main/assets/vacs.html

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate APK
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-APK-RELEASE
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
