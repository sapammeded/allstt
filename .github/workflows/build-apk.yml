name: Build ALLSTT APK

on:
  push:
    branches: [main, android-wrapper]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare original HTML assets
        run: |
          mkdir -p app/src/main/assets
          cp stt.html app/src/main/assets/stt.html
          cp hvss2.html app/src/main/assets/hvss2.html
          cp vacs.html app/src/main/assets/vacs.html

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          find app/build/outputs/apk/debug -type f -name '*.apk' -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-APK-INSTALLABLE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
