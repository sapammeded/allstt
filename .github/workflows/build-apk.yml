name: Build ALLSTT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply STT photo quality and default description patch
        run: |
          python3 patch_stt_quality.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stt.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: improve STT photo PDF quality and patrol default [skip ci]"
            git push
          fi

      - name: Verify STT gallery password protection
        run: |
          grep -q "galleryAccessGranted" stt.html
          grep -q "Masukkan password terlebih dahulu" stt.html
          grep -q "type=\"file\".*multiple" stt.html
          grep -q "DEFAULT_PATROL_DESCRIPTION" stt.html
          grep -q "4096" stt.html
          echo "STT gallery lock, high-resolution photo processing and default description verified."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare HTML assets
        run: |
          mkdir -p app/src/main/assets
          cp stt.html app/src/main/assets/stt.html
          cp hvss2.html app/src/main/assets/hvss2.html
          cp vacs.html app/src/main/assets/vacs.html
          cp launcher.html app/src/main/assets/launcher.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/stt.html')
          html = p.read_text(encoding='utf-8')
          guard = Path('gallery-lock.js').read_text(encoding='utf-8')
          marker = '</body>'
          if 'ALLSTT STT hard gallery guard' not in html:
              if marker in html:
                  html = html.replace(marker, '<script>\\n' + guard + '\\n</script>\\n' + marker, 1)
              else:
                  html += '\\n<script>\\n' + guard + '\\n</script>\\n'
              p.write_text(html, encoding='utf-8')
          PY

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
