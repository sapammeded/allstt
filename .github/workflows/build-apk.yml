name: Build ALLSTT APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CURRENT repository baseline
        uses: actions/checkout@v4

      # IMPORTANT: These patches are build-time only and touch HVSS2.
      # They must never replace launcher.html, AndroidManifest.xml, or icon resources.
      - name: Apply ONLY HVSS2 Key Loan Log patch
        run: python3 apply_hvss2_keylog_patch.py

      - name: Apply ONLY HVSS2 PDF fallback
        run: python3 apply_hvss2_pdf_fallback.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply ONLY unified ADMIN authorization
        run: python3 apply_admin_patch.py

      - name: Enforce single ADMIN gate without replacing baseline UI
        run: python3 enforce_admin_gate.py

      - name: Apply protected gallery/company feature policy
        run: python3 protect_features.py

      - name: Remove any duplicate legacy gallery success alerts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('stt.html')
          s = p.read_text(encoding='utf-8')
          legacy = "alert('✅ Foto berhasil ditambahkan ke '+area.name);"
          before = s.count(legacy)
          s = s.replace(legacy, '')
          p.write_text(s, encoding='utf-8')
          print(f'Removed legacy gallery success alerts: {before}')
          PY

      - name: Prepare CURRENT HTML assets unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('app/src/main/assets')
          a.mkdir(parents=True, exist_ok=True)
          for n in ('stt.html', 'hvss2.html', 'vacs.html', 'launcher.html'):
              src = Path(n)
              if not src.is_file():
                  raise SystemExit(f'Missing root asset: {n}')
              (a / n).write_text(src.read_text(encoding='utf-8'), encoding='utf-8')
          PY

      - name: Verify HVSS2 Key Loan Log and PDF fallback
        run: |
          grep -q 'HVSS-KEY-LOAN-LOG-PATCH-V1' hvss2.html
          grep -q 'data-page="keylogPage"' hvss2.html
          grep -q 'id="keyLogBody"' hvss2.html
          grep -q 'id="keyLogPdf"' hvss2.html
          grep -q 'HVSS-PDF-FALLBACK-V2' hvss2.html
          grep -q 'HVSS_PDF_FALLBACK' hvss2.html

      - name: Verify baseline Kamera & Area Patroli exists
        run: |
          grep -q 'id="cameraTab"' stt.html
          grep -q 'id="openCameraMenu"' stt.html
          grep -q 'id="galleryCameraInput"' stt.html
          grep -q 'id="targetAreaSelect"' stt.html

      - name: Verify company identity & signature baseline exists
        run: |
          grep -q 'id="companySection"' stt.html
          grep -q 'IDENTITAS PERUSAHAAN' stt.html
          grep -q 'TANDA TANGAN' stt.html

      - name: Verify final ADMIN gate exists
        run: grep -q 'ALLSTT-FINAL-ADMIN-GATE-V1' stt.html

      - name: Verify protected feature policy
        run: |
          grep -q 'Protected actions ask for ADMIN' stt.html
          ! grep -q "alert('✅ Foto berhasil ditambahkan ke '+area.name)" stt.html

      - name: Verify launcher and icon are untouched
        shell: bash
        run: |
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s launcher.html
          test -s app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          ICON_SHA=$(git hash-object app/src/main/res/mipmap-xxxhdpi/ic_launcher.png)
          test "$ICON_SHA" = "a2691133cd23eea5b8cf9680001548bd0aeda9e0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLSTT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
