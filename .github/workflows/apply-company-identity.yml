name: Apply Company Identity Upgrade
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply identity upgrade
        run: python3 tools/company_identity_upgrade.py
      - name: Commit patched STT
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stt.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'manual: company identity upgrade'
          git push
